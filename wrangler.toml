name = "rf4"
compatibility_date = "2025-07-01"
# Pages 项目名取自顶层 name（rf4，rf4-cxt 只是 pages.dev 域名前缀）；
# pages_build_output_dir 必须放顶层，wrangler 才会把本文件识别为 Pages 配置。
# 构建命令（npm run build）由 CF Dashboard 的 Git 集成配置控制，不在此文件中。
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "rf4"
database_id = "bead5b3b-5a98-4fd3-82fa-c63115544ccd"
migrations_dir = "./migrations"

# Screenshot recognition relies on Cloudflare Workers AI.
# To enable:
#   1. In Cloudflare Dashboard > Pages > rf4 > Functions > Bindings, add an "AI" binding.
#   2. Workers AI requires a paid Workers plan or Workers AI subscription.
#   3. Optional: override the default vision model with [vars] RECOGNITION_MODEL.
#
# [vars]
# RECOGNITION_MODEL = "@cf/moondream/moondream3.1-9B-A2B"

# IMPORT_PASSWORD 不再放在明文 vars 中，改用 secret：
#   生产环境：npx wrangler pages secret put IMPORT_PASSWORD --project-name rf4
#   本地开发：在项目根目录创建 .dev.vars 文件，写入 IMPORT_PASSWORD=xxx（已加入 .gitignore）